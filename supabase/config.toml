project_id = "crmwtp"

# Espejo de la configuración viva de los webhooks: Meta llama sin JWT. Sin
# estas entradas, un `supabase functions deploy` genérico los redesplegaría
# con verify_jwt = true y Meta dejaría de entregar mensajes.
[functions.meta-webhook]
verify_jwt = false

[functions.whatsapp-handler]
verify_jwt = true

# Lo llama pg_cron (sin JWT) con el secreto x-cron-secret.
[functions.purge-media]
verify_jwt = false
